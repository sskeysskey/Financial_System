<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
      margin: 0;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 6px;
    }

    .hint {
      color: #666;
      font-size: 12px;
      margin: 4px 0 8px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      font-size: 12px;
    }

    textarea {
      width: 100%;
      height: 56px;
      font-size: 11px;
      box-sizing: border-box;
      margin-top: 6px;
      font-family: Menlo, monospace;
    }

    button {
      width: 100%;
      padding: 6px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    #status,
    #bridgeStatus,
    #pageStatus {
      margin-top: 8px;
      font-size: 12px;
      color: #059669;
      line-height: 1.5;
      word-break: break-all;
      white-space: pre-wrap;
    }

    #pageStatus {
      color: #334155;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 6px 8px;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }

    .row label {
      flex: none;
      color: #444;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0 6px;
    }

    .small {
      font-size: 11px;
      color: #999;
    }

    .primary {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    .warn {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="pageStatus">正在检测当前页面…</div>

  <div class="row" style="margin-top:10px;">
    <input type="checkbox" id="autoChk" style="width:auto;">
    <label for="autoChk"><b>启用自动抓取（总开关，默认关闭）</b></label>
  </div>
  <div class="warn">关闭时：只有下面的手动按钮会抓取并写入本机 JSON；页面滚动 / 定时器 / 点击徽章看图都<b>不会</b>抓取或改动文件。</div>

  <hr>
  <h1>① 同步标签数据（本地 → 网页）</h1>
  <p class="hint">选择本地的 <code>description.json</code>：</p>
  <input type="file" id="fileInput" accept=".json,application/json">
  <p class="hint" style="margin-top:8px;">或直接粘贴 JSON（备用）：</p>
  <textarea id="pasteArea" placeholder='{"stocks":[...],"etfs":[...]}'></textarea>
  <button id="pasteBtn">解析粘贴内容</button>
  <div class="row">
    <label for="maxTags">每行最多显示</label>
    <input type="number" id="maxTags" min="1" max="10" value="2" style="width:52px;">
    <span class="small">个标签</span>
  </div>
  <button id="clearBtn" style="background:#fff;color:#b91c1c;">清空标签缓存</button>
  <div id="status"></div>

  <hr>
  <h1>② 持仓快照（/app/positions）</h1>
  <p class="hint">覆盖式，只保留最新一次的全量快照。</p>
  <button id="pingBtn">🔌 测试本地桥接连接</button>
  <button id="scanBtn" class="primary">⬇️ 手动抓取全部持仓（自动滚屏）</button>
  <button id="dumpBtn">🔍 查看本页已抓取的持仓</button>
  <button id="serverBtn">📄 查看本机 positions JSON</button>

  <hr>
  <h1>③ 买卖痕迹（/app/order-status）</h1>
  <p class="hint">追加式，长期累积你的买入/卖出记录，永不覆盖。</p>
  <button id="scanOrdersBtn" class="primary">⬇️ 手动抓取订单记录（自动滚屏）</button>
  <button id="dumpOrdersBtn">🔍 查看本页已抓取的订单</button>
  <button id="serverOrdersBtn">📄 查看本机 orders JSON</button>
  <div id="bridgeStatus"></div>

  <div class="row">
    <input type="checkbox" id="dbgChk" style="width:auto;">
    <label for="dbgChk" class="small">开启控制台调试日志</label>
  </div>

  <hr>
  <p class="small">图表里 <b>I</b> = 买入点显隐，<b>U</b> = 卖出点显隐，<b>X</b> = 全部浮框显隐。</p>

  <script src="popup.js"></script>
</body>

</html>
