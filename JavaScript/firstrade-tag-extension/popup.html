<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
      margin: 0;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 6px;
    }

    h2 {
      font-size: 13px;
      margin: 12px 0 4px;
      color: #0f172a;
    }

    .hint {
      color: #666;
      font-size: 12px;
      margin: 4px 0 8px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      font-size: 12px;
    }

    textarea {
      width: 100%;
      height: 60px;
      font-size: 11px;
      box-sizing: border-box;
      margin-top: 6px;
      font-family: Menlo, monospace;
    }

    button {
      width: 100%;
      padding: 6px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    #status,
    #bridgeStatus {
      margin-top: 8px;
      font-size: 12px;
      color: #059669;
      line-height: 1.5;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }

    .row label {
      flex: none;
      color: #444;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0 6px;
    }

    .small {
      font-size: 11px;
      color: #999;
    }

    .primary {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h1>① 同步标签数据（本地 → 网页）</h1>
  <p class="hint">选择本地的 <code>description.json</code>：</p>
  <input type="file" id="fileInput" accept=".json,application/json">

  <p class="hint" style="margin-top:8px;">或直接粘贴 JSON（备用）：</p>
  <textarea id="pasteArea" placeholder='{"stocks":[...],"etfs":[...]}'></textarea>
  <button id="pasteBtn">解析粘贴内容</button>

  <div class="row">
    <label for="maxTags">每行最多显示</label>
    <input type="number" id="maxTags" min="1" max="10" value="2" style="width:52px;">
    <span class="small">个标签</span>
  </div>
  <button id="clearBtn" style="background:#fff;color:#b91c1c;">清空标签缓存</button>
  <div id="status"></div>

  <hr>
  <h1>② 回传持仓数据（网页 → 本地）</h1>
  <p class="hint">先确保 <code>bridge_server.py</code> 已在终端运行。</p>
  <button id="pingBtn">🔌 测试本地桥接连接</button>
  <button id="scanBtn" class="primary">⬇️ 抓取全部持仓（自动滚动整表）</button>
  <button id="dumpBtn">🔍 查看当前已抓取的数据</button>
  <button id="serverBtn">📄 查看本机已保存的 JSON</button>
  <div id="bridgeStatus"></div>

  <div class="row">
    <input type="checkbox" id="dbgChk" style="width:auto;">
    <label for="dbgChk" class="small">开启控制台调试日志</label>
  </div>

  <hr>
  <p class="small">改完 description.json 后重新导入一次即可，无需重启浏览器。</p>

  <script src="popup.js"></script>
</body>

</html>
