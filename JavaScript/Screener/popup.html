<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Finance Data Scraper</title>
    <style>
        body {
            width: 380px;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 17px;
        }

        .btns {
            margin-bottom: 8px;
        }

        button {
            font-size: 12px;
            padding: 4px 10px;
            margin-right: 6px;
            cursor: pointer;
        }

        .progress {
            margin-top: 6px;
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4285f4;
            transition: width .3s;
        }

        .status {
            margin-top: 8px;
            font-weight: bold;
            color: #333;
            min-height: 20px;
        }

        .hint {
            margin-top: 4px;
            font-size: 11px;
            color: #888;
        }

        .log-container {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #f9f9f9;
            height: 230px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #555;
        }

        .log-message {
            margin: 0 0 4px 0;
            border-bottom: 1px dashed #eee;
        }

        .log-message:last-child {
            border-bottom: none;
        }

        .log-success {
            color: #28a745;
        }

        .log-error {
            color: #dc3545;
            font-weight: bold;
        }

        .log-warning {
            color: #b8860b;
        }

        .log-final {
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>Yahoo Finance Data Scraper</h2>

    <div class="btns">
        <button id="btnRestart">重新开始</button>
        <button id="btnStop">停止</button>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">Initializing...</div>
    <div class="hint">任务在后台运行，关闭此窗口不会中断。</div>

    <div class="log-container" id="logContainer"></div>

    <script src="popup.js"></script>
</body>

</html>
