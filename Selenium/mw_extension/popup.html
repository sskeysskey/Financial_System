<!doctype html>
<html lang="zh-CN">

<head>

  <style>
    body {
      font: 13px -apple-system, "PingFang SC", sans-serif;
      width: 300px;
      margin: 12px

    .row {
      margin: 6px 0

    button {

      padding: 6px;
      margin-top: 6px
    }

    #bridge.ok {

  <button id="stop">停止当前任务</button>
  <div class="row"><small>启动命令：python3 ~/Coding/Financial_System/Selenium/MW_Bridge.py --no-open</small></div>
